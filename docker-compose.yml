services:
  postgres:
    image: postgres:16-alpine
    container_name: church-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: church_flow
      POSTGRES_PASSWORD: church_flow_dev
      POSTGRES_DB: church_flow_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U church_flow -d church_flow_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: church-flow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: church_flow_minio
      MINIO_ROOT_PASSWORD: church_flow_minio_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
